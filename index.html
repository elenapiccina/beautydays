<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BEAUTY & SPA EDIT — Nude Powder Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nudeBg: '#F7F5F0',
            nudeCard: '#FFFFFF',
            espresso: '#3D3835',
            sand: '#EAE4DC',
            champagne: '#C5A880',
            champagneLight: '#F5F0E6',
            taupeMuted: '#8C827B',
            softBorder: '#E3DDD5'
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #F7F5F0;
      --espresso: #3D3835;
      --champagne: #C5A880;
      --sand: #EAE4DC;
    }

    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--espresso);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 3px;
      height: 3px;
    }
    ::-webkit-scrollbar-track {
      background: #F0ECE6;
    }
    ::-webkit-scrollbar-thumb {
      let: #C5A880;
      background: #C5A880;
      border-radius: 3px;
    }

    .font-section-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
    }

    /* Smooth rollout */
    .rollout {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      opacity: 0;
    }
    .rollout.expanded {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .rollout-inner {
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-5 max-w-xl mx-auto flex flex-col justify-between">

  <main class="space-y-3.5 w-full">

    <!-- Header Widget -->
    <header class="bg-white border border-softBorder rounded-2xl p-4 shadow-xs flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5 text-[8.5px] font-sans font-light tracking-[0.25em] text-taupeMuted uppercase mb-0.5">
          <span>COSMETOLOGY & SPA EDIT</span>
          <span>•</span>
          <span id="headerDate">SEP 2026</span>
        </div>
        <h1 class="text-2xl font-section-title font-semibold tracking-tight text-espresso leading-none">
          Beauty & Self-Care Tracker
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="text-[9px] font-sans font-medium tracking-[0.18em] uppercase px-3 py-1.5 bg-espresso text-white rounded-full hover:bg-champagne transition shadow-xs flex items-center gap-1">
          <span>✨ ADD SERVICE</span>
        </button>
      </div>
    </header>

    <!-- Highlight Next Appointment Banner -->
    <section id="nextAppointmentBanner" class="bg-champagneLight border border-champagne/40 rounded-2xl p-3.5 shadow-xs flex items-center justify-between">
      <div class="space-y-0.5">
        <span class="text-[8px] font-sans font-light tracking-[0.2em] text-taupeMuted uppercase">NEXT UPCOMING RITUAL</span>
        <div id="nextTitle" class="text-base font-section-title font-bold text-espresso">Manicure & Gel Polish</div>
        <div id="nextSub" class="text-[11px] font-sans font-light text-espresso/80">Due in 3 days (Oct 2, 2026)</div>
      </div>
      <div class="h-10 w-10 rounded-full bg-white border border-champagne/50 flex items-center justify-center text-lg flex-shrink-0 shadow-xs">
        💅
      </div>
    </section>

    <!-- Services List Container -->
    <section class="space-y-2.5" id="servicesContainer">
      <!-- Dynamic service items injected via JS -->
    </section>

  </main>

  <!-- Footer copyright / subtle note -->
  <footer class="mt-6 text-center border-t border-softBorder/60 pt-3">
    <span class="text-[8.5px] font-sans font-light tracking-[0.2em] text-taupeMuted uppercase">
      THE BEAUTY EDIT • NUDE POWDER PALETTE
    </span>
  </footer>

  <!-- Modal for Adding / Editing Service -->
  <div id="serviceModal" class="fixed inset-0 bg-espresso/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-softBorder rounded-2xl w-full max-w-md p-5 shadow-xl space-y-4">
      
      <div class="flex items-center justify-between border-b border-softBorder pb-2.5">
        <h2 id="modalTitle" class="font-section-title text-xl font-bold text-espresso">Log New Beauty Service</h2>
        <button onclick="closeModal()" class="text-taupeMuted hover:text-espresso text-sm font-bold px-2">✕</button>
      </div>

      <form id="serviceForm" onsubmit="handleSaveService(event)" class="space-y-3">
        <input type="hidden" id="editServiceId">

        <div class="space-y-1">
          <label class="block text-[8.5px] font-sans font-light tracking-[0.2em] uppercase text-taupeMuted">SERVICE TITLE *</label>
          <input type="text" id="serviceName" required placeholder="e.g. Manicure, Facial, Lashes, Hair Gloss..."
                 class="w-full bg-nudeBg border border-softBorder rounded-xl px-3 py-2 text-xs font-sans text-espresso focus:outline-none focus:border-champagne">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div class="space-y-1">
            <label class="block text-[8.5px] font-sans font-light tracking-[0.2em] uppercase text-taupeMuted">CATEGORY ICON</label>
            <select id="serviceIcon" class="w-full bg-nudeBg border border-softBorder rounded-xl px-3 py-2 text-xs font-sans text-espresso focus:outline-none focus:border-champagne">
              <option value="💅">💅 Nails</option>
              <option value="🌿">🌿 Spa / Massage</option>
              <option value="✨">✨ Cosmetology / Facial</option>
              <option value="👁️">👁️ Lashes & Brows</option>
              <option value="💇‍♀️">💇‍♀️ Hair Care</option>
              <option value="🌸">🌸 Other Ritual</option>
            </select>
          </div>

          <div class="space-y-1">
            <label class="block text-[8.5px] font-sans font-light tracking-[0.2em] uppercase text-taupeMuted">FREQUENCY (WEEKS)</label>
            <input type="number" id="serviceWeeks" min="1" max="52" value="3" required
                   class="w-full bg-nudeBg border border-softBorder rounded-xl px-3 py-2 text-xs font-sans text-espresso focus:outline-none focus:border-champagne">
          </div>
        </div>

        <div class="space-y-1">
          <label class="block text-[8.5px] font-sans font-light tracking-[0.2em] uppercase text-taupeMuted">LAST DONE DATE *</label>
          <input type="date" id="serviceLastDate" required
                 class="w-full bg-nudeBg border border-softBorder rounded-xl px-3 py-2 text-xs font-sans text-espresso focus:outline-none focus:border-champagne">
        </div>

        <div class="space-y-1">
          <label class="block text-[8.5px] font-sans font-light tracking-[0.2em] uppercase text-taupeMuted">NOTES / MASTER / STUDIO (OPTIONAL)</label>
          <input type="text" id="serviceNotes" placeholder="e.g. Studio on Nevsky, nude base gel..."
                 class="w-full bg-nudeBg border border-softBorder rounded-xl px-3 py-2 text-xs font-sans text-espresso focus:outline-none focus:border-champagne">
        </div>

        <div class="flex items-center justify-between pt-2">
          <button type="button" onclick="closeModal()" class="text-[9px] font-sans font-light text-taupeMuted hover:text-espresso underline">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 bg-espresso text-white rounded-full text-[9px] font-sans font-normal tracking-[0.2em] uppercase hover:bg-champagne transition shadow-xs">
            Save Service
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    const STORAGE_KEY = 'THE_BEAUTY_SPA_EDIT_V1';

    let services = [
      {
        id: '1',
        name: 'Manicure & Gel Overlay',
        icon: '💅',
        weeks: 3,
        lastDate: '2026-09-11',
        notes: 'Classic milky nude base'
      },
      {
        id: '2',
        name: 'Facial Cleansing & Peel',
        icon: '✨',
        weeks: 4,
        lastDate: '2026-09-05',
        notes: 'HydraFacial & LED therapy'
      },
      {
        id: '3',
        name: 'Eyebrow Lamination & Tint',
        icon: '👁️',
        weeks: 5,
        lastDate: '2026-08-28',
        notes: 'Soft natural arch'
      },
      {
        id: '4',
        name: 'Hair Gloss & Scalp Treatment',
        icon: '💇‍♀️',
        weeks: 6,
        lastDate: '2026-08-15',
        notes: 'Alerana mask & trimming'
      }
    ];

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          services = JSON.parse(saved);
        } catch(e) { console.error(e); }
      }

      document.getElementById('headerDate').innerText = new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }).toUpperCase();
      render();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(services));
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function calculateNextDate(lastDateStr, weeks) {
      const last = new Date(lastDateStr + 'T00:00:00');
      const next = new Date(last);
      next.setDate(last.getDate() + (parseInt(weeks) * 7));
      return next;
    }

    function render() {
      const container = document.getElementById('servicesContainer');
      container.innerHTML = '';

      const today = new Date();
      today.setHours(0,0,0,0);

      // Compute status for all services and sort by closest due date
      const computed = services.map(s => {
        const nextDate = calculateNextDate(s.lastDate, s.weeks);
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        return { ...s, nextDate, diffDays };
      }).sort((a, b) => a.diffDays - b.diffDays);

      // Update Next Banner
      if (computed.length > 0) {
        const nearest = computed[0];
        document.getElementById('nextTitle').innerText = nearest.name;
        let subText = '';
        if (nearest.diffDays < 0) {
          subText = `Overdue by ${Math.abs(nearest.diffDays)} days (${formatDate(nearest.nextDate.toISOString().split('T')[0])})`;
        } else if (nearest.diffDays === 0) {
          subText = `Due Today! (${formatDate(nearest.nextDate.toISOString().split('T')[0])})`;
        } else {
          subText = `Due in ${nearest.diffDays} days (${formatDate(nearest.nextDate.toISOString().split('T')[0])})`;
        }
        document.getElementById('nextSub').innerText = subText;
      } else {
        document.getElementById('nextTitle').innerText = 'No Services Logged';
        document.getElementById('nextSub').innerText = 'Click "Add Service" to begin tracking.';
      }

      // Render Service Cards
      computed.forEach(s => {
        const nextDateStr = s.nextDate.toISOString().split('T')[0];
        const formattedNext = formatDate(nextDateStr);
        const formattedLast = formatDate(s.lastDate);

        let badgeClass = 'bg-nudeBg text-espresso border-softBorder';
        let badgeText = `In ${s.diffDays} days`;
        if (s.diffDays < 0) {
          badgeClass = 'bg-red-50 text-red-600 border-red-200';
          badgeText = `Overdue (${Math.abs(s.diffDays)}d)`;
        } else if (s.diffDays === 0) {
          badgeClass = 'bg-champagne/20 text-espresso border-champagne';
          badgeText = 'Due Today';
        }

        const card = document.createElement('div');
        card.className = 'bg-white border border-softBorder rounded-2xl p-3.5 shadow-xs flex items-center justify-between gap-3';
        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <div class="h-10 w-10 rounded-xl bg-nudeBg border border-softBorder flex items-center justify-center text-lg flex-shrink-0">
              ${s.icon}
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <h3 class="font-section-title text-base font-semibold text-espresso truncate">${s.name}</h3>
                <span class="text-[8.5px] font-sans px-2 py-0.5 rounded-full border ${badgeClass} flex-shrink-0">${badgeText}</span>
              </div>
              <div class="text-[10px] font-sans font-light text-taupeMuted truncate mt-0.5">
                Last: ${formattedLast} • Every ${s.weeks} wks • Next: ${formattedNext} ${s.notes ? '• ' + s.notes : ''}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-shrink-0">
            <button onclick="quickLogToday('${s.id}')" title="Mark Done Today" class="px-2.5 py-1 text-[9px] font-sans font-medium uppercase tracking-wider bg-champagneLight border border-champagne/40 rounded-lg text-espresso hover:bg-champagne hover:text-white transition">
              ✓ Done Today
            </button>
            <button onclick="openEditModal('${s.id}')" title="Edit Service" class="p-1.5 text-taupeMuted hover:text-espresso rounded-lg hover:bg-nudeBg transition">
              ✎
            </button>
            <button onclick="deleteService('${s.id}')" title="Delete" class="p-1.5 text-taupeMuted hover:text-red-600 rounded-lg hover:bg-red-50 transition">
              ✕
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal() {
      document.getElementById('modalTitle').innerText = 'Log New Beauty Service';
      document.getElementById('editServiceId').value = '';
      document.getElementById('serviceName').value = '';
      document.getElementById('serviceIcon').value = '💅';
      document.getElementById('serviceWeeks').value = '3';
      document.getElementById('serviceLastDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('serviceNotes').value = '';
      document.getElementById('serviceModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const s = services.find(item => item.id === id);
      if (!s) return;
      document.getElementById('modalTitle').innerText = 'Edit Beauty Service';
      document.getElementById('editServiceId').value = s.id;
      document.getElementById('serviceName').value = s.name;
      document.getElementById('serviceIcon').value = s.icon;
      document.getElementById('serviceWeeks').value = s.weeks;
      document.getElementById('serviceLastDate').value = s.lastDate;
      document.getElementById('serviceNotes').value = s.notes || '';
      document.getElementById('serviceModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('serviceModal').classList.add('hidden');
    }

    function handleSaveService(e) {
      e.preventDefault();
      const id = document.getElementById('editServiceId').value;
      const name = document.getElementById('serviceName').value;
      const icon = document.getElementById('serviceIcon').value;
      const weeks = parseInt(document.getElementById('serviceWeeks').value) || 3;
      const lastDate = document.getElementById('serviceLastDate').value;
      const notes = document.getElementById('serviceNotes').value;

      if (id) {
        const idx = services.findIndex(item => item.id === id);
        if (idx !== -1) {
          services[idx] = { id, name, icon, weeks, lastDate, notes };
        }
      } else {
        const newId = '_' + Math.random().toString(36).substr(2, 9);
        services.push({ id: newId, name, icon, weeks, lastDate, notes });
      }

      saveState();
      closeModal();
      render();
    }

    function quickLogToday(id) {
      const s = services.find(item => item.id === id);
      if (!s) return;
      s.lastDate = new Date().toISOString().split('T')[0];
      saveState();
      render();
    }

    function deleteService(id) {
      if (confirm('Are you sure you want to delete this service?')) {
        services = services.filter(item => item.id !== id);
        saveState();
        render();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
